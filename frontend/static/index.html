<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Travel Concierge</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0f766e;
    --accent-hover: #115e59;
    --accent-gradient: linear-gradient(135deg, #0f766e 0%, #0284c7 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-muted: #64748b;
    --user-bubble: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    --input-bg: #f8fafc;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  }

  body.dark-theme {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --input-bg: #1e293b;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  header {
    background: var(--accent-gradient);
    color: #ffffff;
    padding: 1rem 1.5rem;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    letter-spacing: -0.02em;
  }

  header .subtitle {
    font-size: 0.85rem;
    opacity: 0.9;
    font-weight: 400;
  }

  .theme-toggle-btn {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .theme-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: scale(1.05);
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeInUp 0.25s ease-out forwards;
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }

  .sender-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
    padding: 0 0.4rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    line-height: 1.5;
    font-size: 0.98rem;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-primary);
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(13, 148, 136, 0.25);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* --- Typing Indicator --- */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.2rem;
  }
  .typing-indicator span {
    width: 8px;
    height: 8px;
    background-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: typingBounce 1.3s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: 0s; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* --- Category Filters & Prompts Bar --- */
  #prompts-section {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1rem 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .category-tabs {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .category-tabs::-webkit-scrollbar { display: none; }

  .tab-chip {
    padding: 0.35rem 0.75rem;
    border-radius: 16px;
    font-size: 0.8rem;
    font-weight: 600;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .tab-chip.active, .tab-chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .prompts-list {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .prompts-list::-webkit-scrollbar { display: none; }

  .prompt-chip {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.5rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .prompt-chip:hover {
    background: #f0fdf4;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  body.dark-theme .prompt-chip:hover {
    background: #134e4a;
  }

  /* --- Footer Form --- */
  #input-container {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 0.8rem 1rem 1rem;
    box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.03);
  }

  form {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    gap: 0.6rem;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    background: var(--input-bg);
    color: var(--text-primary);
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
  }

  button.send-btn {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  button.send-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.02); }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }

  /* --- Image Lightbox Modal --- */
  #lightbox-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    padding: 1.5rem;
  }
  #lightbox-modal.active { display: flex; }
  #lightbox-img {
    max-width: 90%;
    max-height: 80vh;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    object-fit: contain;
  }
  .lightbox-actions {
    display: flex;
    gap: 1rem;
  }
  .lightbox-btn {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .lightbox-btn:hover {
    background: rgba(255, 255, 255, 0.4);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>✈️ Smart Travel Concierge</h1>
    <div class="subtitle">AI Personal Travel Assistant & Itinerary Planner</div>
  </div>
  <button class="theme-toggle-btn" id="theme-btn" title="Toggle Theme" onclick="toggleTheme()">
    <span class="material-symbols-outlined" style="color:#fff;">dark_mode</span>
  </button>
</header>

<div id="chat-container"></div>

<div id="prompts-section">
  <div class="category-tabs">
    <button class="tab-chip active" onclick="filterCategory('all', this)">All</button>
    <button class="tab-chip" onclick="filterCategory('culture', this)">🏛️ Culture</button>
    <button class="tab-chip" onclick="filterCategory('weather', this)">🌤️ Weather & Itinerary</button>
    <button class="tab-chip" onclick="filterCategory('postcard', this)">🖼️ Postcards</button>
    <button class="tab-chip" onclick="filterCategory('dining', this)">🍜 Food & Dining</button>
  </div>
  <div class="prompts-list" id="prompts-bar">
    <!-- Prompts rendered dynamically -->
  </div>
</div>

<div id="input-container">
  <form id="form">
    <input id="input" placeholder="Ask about destinations, weather, itineraries, or generate postcards..." autocomplete="off" autofocus>
    <button type="submit" class="send-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="color:#fff; font-size:1.1rem;">send</span>
    </button>
  </form>
</div>

<!-- Image Lightbox Modal -->
<div id="lightbox-modal" onclick="closeLightbox(event)">
  <img id="lightbox-img" src="" alt="Enlarged view">
  <div class="lightbox-actions" onclick="event.stopPropagation()">
    <a id="download-link" class="lightbox-btn" href="" target="_blank" download="postcard.png">
      <span class="material-symbols-outlined">download</span> Download Image
    </a>
    <button class="lightbox-btn" onclick="closeLightbox()">
      <span class="material-symbols-outlined">close</span> Close
    </button>
  </div>
</div>

<script>
const chatContainer = document.getElementById("chat-container");
const form = document.getElementById("form");
const input = document.getElementById("input");
const promptsBar = document.getElementById("prompts-bar");

const PROMPTS_DATA = [
  { cat: "culture", text: "🏛️ Culture & history under $150/day", prompt: "Suggest culture & history destinations under $150/day" },
  { cat: "weather", text: "🌤️ Tokyo weather & itinerary", prompt: "What is the weather in Tokyo and plan a 3-day itinerary?" },
  { cat: "postcard", text: "🖼️ Kyoto postcard image", prompt: "Generate a beautiful postcard for Kyoto" },
  { cat: "dining", text: "🍜 Street food in Penang", prompt: "Recommend top street food spots and local dishes in Penang" },
  { cat: "culture", text: "🏰 Landmarks in Rome", prompt: "What are the must-see historic landmarks in Rome?" }
];

function renderPrompts(category = "all") {
  promptsBar.innerHTML = "";
  const list = category === "all" ? PROMPTS_DATA : PROMPTS_DATA.filter(p => p.cat === category);
  list.forEach(item => {
    const chip = document.createElement("div");
    chip.className = "prompt-chip";
    chip.textContent = item.text;
    chip.onclick = () => sendPrompt(item.prompt);
    promptsBar.appendChild(chip);
  });
}

function filterCategory(cat, btn) {
  document.querySelectorAll(".tab-chip").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderPrompts(cat);
}

renderPrompts();

function toggleTheme() {
  document.body.classList.toggle("dark-theme");
  const isDark = document.body.classList.contains("dark-theme");
  const icon = document.querySelector("#theme-btn span");
  if (icon) icon.textContent = isDark ? "light_mode" : "dark_mode";
}

function openLightbox(src) {
  const modal = document.getElementById("lightbox-modal");
  const img = document.getElementById("lightbox-img");
  const dl = document.getElementById("download-link");
  img.src = src;
  dl.href = src;
  modal.classList.add("active");
}

function closeLightbox(ev) {
  if (!ev || ev.target.id === "lightbox-modal" || ev.target.classList.contains("lightbox-btn")) {
    document.getElementById("lightbox-modal").classList.remove("active");
  }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const label = el("div", "sender-label", who === "user" ? "👤 You" : "✈️ Concierge");
  const b = el("div", "bubble");
  m.appendChild(label);
  m.appendChild(b);
  chatContainer.appendChild(m);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return b;
}

function showTypingIndicator() {
  const m = el("div", "msg agent");
  const label = el("div", "sender-label", "✈️ Concierge");
  const b = el("div", "bubble");
  const typing = el("div", "typing-indicator");
  typing.appendChild(el("span"));
  typing.appendChild(el("span"));
  typing.appendChild(el("span"));
  b.appendChild(typing);
  m.appendChild(label);
  m.appendChild(b);
  chatContainer.appendChild(m);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return m;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Postcard Image";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";

  const indicatorElem = showTypingIndicator();
  const b = indicatorElem.querySelector(".bubble");

  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
